<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPS Monthly Report | GSP.1 Utility</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px "Segoe UI", Tahoma, sans-serif;
      color: #172b43;
      background: #eef3f8;
    }
    .layout { display: grid; grid-template-columns: 235px 1fr; min-height: 100vh; }
    aside { padding: 22px 14px; background: #122a46; color: white; }
    aside h2 { margin: 0 0 4px; }
    aside p { margin: 0 0 20px; color: #bdd9f0; }
    nav button {
      display: block; width: 100%; margin: 3px 0; text-align: left;
      color: white; background: transparent; border: 0;
    }
    nav button:hover, nav button[aria-current="true"] { background: #27557e; }
    main { min-width: 0; padding: 24px; }
    header, section {
      margin-bottom: 16px; padding: 18px; border-radius: 12px; background: white;
    }
    header { background: #145986; color: white; }
    h1 { margin: 0 0 12px; }
    h2 { margin-top: 0; }
    button, input, select, textarea {
      font: inherit; padding: 8px 10px; border: 1px solid #bacbdc; border-radius: 7px;
    }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid #43aaf5; outline-offset: 2px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .fields label { display: grid; gap: 6px; align-content: start; }
    .fields input { width: 100%; min-width: 0; }
    textarea { width: 100%; min-height: 110px; resize: vertical; }
    .scroll { overflow-x: auto; }
    .chart { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; min-width: 520px; }
    .column {
      display: grid; grid-template-rows: 28px 125px 24px;
      align-items: end; padding: 4px; border: 0; background: #f3f7fb;
      text-align: center; color: #172b43;
    }
    .column.selected { background: #daedff; }
    .track { display: flex; align-items: end; justify-content: center; height: 100%; }
    .bar { width: 65%; background: #2284c6; border-radius: 4px 4px 0 0; }
    .muted, #status { color: #4a637c; font-size: 14px; }
    @media (max-width: 700px) {
      .layout { display: block; }
      nav { display: flex; overflow-x: auto; }
      nav button { width: auto; white-space: nowrap; }
      main { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <h2>GSP Smart PPS</h2>
      <p>GSP.1 Utility</p>
      <nav id="menu" aria-label="หัวข้อรายงาน"></nav>
    </aside>

    <main>
      <header>
        <h1 id="title">ภาพรวมประจำเดือน</h1>
        <div class="toolbar">
          <label for="month">เดือนรายงาน</label>
          <input id="month" type="month" min="2000-01" max="2099-12" required>
        </div>
      </header>

      <section id="editor"></section>

      <section>
        <h2>แนวโน้มรายเดือน</h2>
        <label for="metric">ตัวชี้วัด</label>
        <select id="metric"></select>
        <p id="chartYear" class="muted"></p>
        <div class="scroll"><div id="chart" class="chart"></div></div>
        <p class="muted">กดที่เดือนในกราฟเพื่อเปิดรายงาน · “ไม่กรอก” ไม่ใช่ศูนย์</p>
      </section>

      <p id="status" role="status"></p>
    </main>
  </div>

  <script>
    "use strict";

    // เพิ่มหรือเปลี่ยนชื่อเมนูและช่องกรอกได้ตรงนี้
    const sections = [
      { id: "overview", label: "ภาพรวมประจำเดือน" },
      { id: "breakdown", label: "Equipment Breakdown", unit: "ครั้ง", step: 1,
        fields: ["Air Compressor", "Refrigeration", "Cooling Fan", "Aux. Boiler",
                 "WHB", "CHP Boiler", "Sales Gas", "Gen.3"] },
      { id: "offcv", label: "Off Control Value (Lab.)", unit: "ครั้ง", step: 1,
        fields: ["BFW", "Aux. Boiler", "WHB", "CHP Boiler", "Eco CURE"] },
      { id: "c3", label: "C3 Make Up", unit: "m³", step: "any",
        fields: ["Make Up Refrigeration"] },
      { id: "activity", label: "Activity" },
      { id: "pond", label: "บ่อ 200,000 m³" },
      { id: "water", label: "สถานการณ์น้ำระยอง" },
      { id: "weak", label: "Weak Point" },
      { id: "isolation", label: "Isolation Book" },
      { id: "pm", label: "แผน PM ประจำเดือน" },
      { id: "other", label: "อื่น ๆ / Override Bypass" }
    ];

    const metrics = sections.filter(item => item.fields);
    const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.",
                    "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    const $ = id => document.getElementById(id);
    const storageKey = "gsp-pps-report-lite-v1";
    const format = new Intl.NumberFormat("th-TH", { maximumFractionDigits: 2 });

    let reports = {};
    let selected = sections[0];
    const today = new Date();
    let activeMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;

    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
      if (saved && typeof saved === "object" && !Array.isArray(saved)) reports = saved;
    } catch {
      $("status").textContent = "ไม่สามารถอ่านข้อมูลที่บันทึกไว้";
    }

    $("month").value = activeMonth;

    function save() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(reports));
        $("status").textContent = "บันทึกในเบราว์เซอร์เครื่องนี้แล้ว";
      } catch {
        $("status").textContent = "เบราว์เซอร์ไม่อนุญาตให้บันทึก ข้อมูลอาจหายเมื่อปิดหน้า";
      }
    }

    function summary(month, metric) {
      const values = reports[month]?.[metric.id] || {};
      const numbers = metric.fields.map(field => values[field]).filter(Number.isFinite);
      return {
        value: numbers.length ? numbers.reduce((a, b) => a + b, 0) : null,
        complete: numbers.length === metric.fields.length
      };
    }

    function setMonth(month) {
      activeMonth = month;
      $("month").value = month;
      render();
    }

    function renderChart() {
      const metric = metrics.find(item => item.id === $("metric").value);
      const year = activeMonth.slice(0, 4);
      const keys = months.map((_, i) => `${year}-${String(i + 1).padStart(2, "0")}`);
      const data = keys.map(key => summary(key, metric));
      const max = Math.max(1, ...data.map(item => item.value ?? 0));

      $("chartYear").textContent = `${metric.label} (${metric.unit}) · ค.ศ. ${year} · * กรอกยังไม่ครบ`;
      $("chart").replaceChildren();

      data.forEach(({ value, complete }, i) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "column" + (keys[i] === activeMonth ? " selected" : "");
        button.setAttribute("aria-pressed", String(keys[i] === activeMonth));

        const number = document.createElement("span");
        const track = document.createElement("span");
        const label = document.createElement("span");

        number.textContent = value === null ? "ไม่กรอก" : format.format(value) + (complete ? "" : "*");
        label.textContent = months[i];
        track.className = "track";

        if (value !== null) {
          const bar = document.createElement("span");
          bar.className = "bar";
          bar.style.height = `${Math.max(2, value / max * 100)}%`;
          track.append(bar);
        }

        button.append(number, track, label);
        button.onclick = () => setMonth(keys[i]);
        $("chart").append(button);
      });
    }

    function renderEditor() {
      const editor = $("editor");
      const heading = document.createElement("h2");
      heading.textContent = selected.label;
      editor.replaceChildren(heading);

      if (selected.id === "overview") {
        for (const metric of metrics) {
          const { value, complete } = summary(activeMonth, metric);
          const line = document.createElement("p");
          line.textContent = `${metric.label}: ` + (value === null
            ? "ยังไม่กรอก"
            : `${format.format(value)} ${metric.unit}${complete ? "" : " (กรอกยังไม่ครบ)"}`);
          editor.append(line);
        }
        const tip = document.createElement("p");
        tip.className = "muted";
        tip.textContent = "เลือกหัวข้อจากเมนูด้านซ้ายเพื่อกรอกข้อมูลของเดือนที่เปิดอยู่";
        editor.append(tip);
        return;
      }

      if (!selected.fields) {
        const key = selected.id;
        const note = document.createElement("textarea");
        note.setAttribute("aria-label", `รายละเอียด ${selected.label}`);
        note.placeholder = "กรอกรายละเอียดของเดือนนี้";
        note.value = reports[activeMonth]?.[key] || "";
        note.oninput = () => {
          (reports[activeMonth] ??= {})[key] = note.value;
          save();
        };
        editor.append(note);
        return;
      }

      const metric = selected;
      const fields = document.createElement("div");
      fields.className = "fields";
      for (const name of metric.fields) {
        const label = document.createElement("label");
        label.textContent = `${name} (${metric.unit})`;

        const input = document.createElement("input");
        input.type = "number";
        input.min = "0";
        input.step = metric.step;
        input.placeholder = "ยังไม่กรอก";
        input.value = reports[activeMonth]?.[metric.id]?.[name] ?? "";

        input.oninput = () => {
          if (!input.validity.valid) {
            $("status").textContent = "ค่าที่กรอกไม่ถูกต้อง ช่องนี้ยังไม่ได้บันทึก";
            return;
          }
          const month = reports[activeMonth] ??= {};
          const values = month[metric.id] ??= {};
          if (input.value === "") delete values[name];
          else values[name] = input.valueAsNumber;

          $("metric").value = metric.id;
          save();
          renderChart();
        };

        label.append(input);
        fields.append(label);
      }
      editor.append(fields);
    }

    function render() {
      $("title").textContent = selected.label;
      for (const button of $("menu").children) {
        button.setAttribute("aria-current", String(button.dataset.id === selected.id));
      }
      renderEditor();
      renderChart();
    }

    for (const item of sections) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = item.label;
      button.dataset.id = item.id;
      button.onclick = () => {
        selected = item;
        if (item.fields) $("metric").value = item.id;
        render();
      };
      $("menu").append(button);
    }

    for (const metric of metrics) {
      $("metric").add(new Option(metric.label, metric.id));
    }

    $("month").onchange = event => {
      if (event.target.value && event.target.validity.valid) setMonth(event.target.value);
      else event.target.value = activeMonth;
    };
    $("metric").onchange = renderChart;

    render();
  </script>
</body>
</html>

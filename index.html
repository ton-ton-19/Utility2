<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSP SMART PPS | GSP.1</title>
  <style>
    :root {
      --navy:#10192b; --blue:#276be3; --ink:#121e33;
      --muted:#51627a; --line:#dde6f1; --bg:#f5f7fb;
      --sidebar:242px;
    }
    * { box-sizing:border-box }
    [hidden] { display:none !important }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px "Segoe UI",Tahoma,sans-serif }
    body.compact { --sidebar:76px }
    aside {
      position:fixed; inset:0 auto 0 0; width:var(--sidebar);
      background:var(--navy); color:#fff; padding:24px 16px;
      display:flex; flex-direction:column;
    }
    .brand { display:flex; align-items:center; gap:11px; padding:4px 5px 20px; border-bottom:1px solid #293549 }
    .mark { flex:none; width:36px; height:36px; display:grid; place-items:center; background:var(--blue); border-radius:9px; font-size:20px }
    .brand strong { display:block; font-size:16px; white-space:nowrap }
    .brand small { display:block; margin-top:4px; font-size:10px; color:#a6bad6; white-space:nowrap }
    nav { overflow:auto; scrollbar-width:thin; margin:10px 0; flex:1 }
    .group { display:block; padding:9px 5px 4px; color:#9eafcb; font-size:10px; letter-spacing:.8px }
    button,input,select,textarea { font:inherit }
    button { cursor:pointer; border:0; border-radius:9px; padding:9px 13px; background:#e8effb; color:#17447f; font-weight:650 }
    button:hover { filter:brightness(.96) }
    nav button { width:100%; display:flex; align-items:center; gap:8px; text-align:left; font-size:12px; color:#c0d0e7; background:transparent; padding:8px 6px; margin:2px 0 }
    nav button:hover { background:#1b2b45 }
    nav button[aria-current="page"],.primary { background:var(--blue); color:white }
    .navicon { display:grid; place-items:center; flex:none; width:19px; height:19px; border-radius:4px; background:#ffffff19; font-size:11px }

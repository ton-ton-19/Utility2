<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSP SMART PPS | GSP.1</title>
<style>
:root{--nav:#101b30;--blue:#245fce;--ink:#172640;--muted:#50627e;--line:#dde6f2;--bg:#f4f7fb;--side:242px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px "Segoe UI",Tahoma,sans-serif}
body.compact{--side:74px}
aside{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--nav);color:white;display:flex;flex-direction:column;padding:17px}
.brand{display:flex;align-items:center;gap:10px;padding:8px 0 18px;border-bottom:1px solid #2e405b;white-space:nowrap}
.mark{background:var(--blue);border-radius:8px;padding:7px 10px}
.brand small,.group{display:block;color:#a8bbd7;font-size:11px}
nav{flex:1;overflow:auto;scrollbar-width:thin;padding:8px 0}
.group{margin:13px 5px 5px;letter-spacing:.7px;font-size:10px}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:8px;background:#e8effb;color:#17447f;padding:9px 12px;font-weight:650;cursor:pointer}
button:hover{filter:brightness(.95)}
nav button{display:flex;align-items:center;gap:8px;width:100%;margin:2px 0;text-align:left;background:transparent;color:#c5d5ec;font-size:12px}
nav button:hover,aside footer button{background:#1b2b45;color:white}
nav button[aria-current="page"],.primary{background:var(--blue);color:white}
.icon{display:inline-block;width:19px;text-align:center;flex:none}
.compact :is(.brandcopy,.group,.navtext){display:none}
.compact nav button{justify-content:center}
aside footer{padding-top:10px;border-top:1px solid #2e405b}
aside footer button{width:100%}
main{margin-left:var(--side);min-width:0;padding:0 28px 30px}
header{margin:0 -28px 21px;padding:21px 28px;background:white;border-bottom:1px solid var(--line)}
.head,.section-head,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head,.section-head{justify-content:space-between}
.kicker{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--blue)}
h1{font-size:28px;margin:5px 0}
h2{font-size:18px;margin:0}
p,small{color:var(--muted)}
.content{max-width:1120px;margin:auto}
.panel,.metric{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:15px;box-shadow:0 2px 6px #15243b09}
.section-head{padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.grid,.cards{display:grid;gap:12px}
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards{grid-template-columns:repeat(4,minmax(0,1fr))}
.metric{border-top:3px solid var(--blue)}
.metric strong{display:block;margin-top:5px;font-size:24px}
label{display:grid;gap:6px;color:#36516e;font-size:13px;font-weight:650}
input,select,textarea{width:100%;min-width:0;padding:9px;border:1px solid #ccd9eb;border-radius:8px;background:#fbfcfe;color:var(--ink)}
textarea{min-height:75px;resize:vertical}
.wide{grid-column:1/-1}
.actions{margin-top:12px}
.note{font-size:13px}
[role="status"]{background:#eef5ff;padding:9px 12px;border:1px solid #d5e5fb;border-radius:8px}
.error,.danger{background:#fff0ee!important;color:#902521!important}
.scroll{overflow:auto}
table{width:100%;min-width:640px;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{background:#f0f5fc;color:#375472}
.row-buttons{display:flex;gap:5px;flex-wrap:wrap}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;min-width:480px}
.bar-col{display:grid;grid-template-rows:20px 94px 23px;justify-items:center;align-items:end;font-size:11px;color:var(--muted)}
.bar{width:60%;max-width:30px;background:#91b8f4;border-radius:4px 4px 0 0}
.bar.selected{background:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){
  aside{position:static;width:auto;padding:12px}
  nav{max-height:160px}
  aside footer{display:none}
  main{margin:0;padding:0 14px 20px}
  header{margin:0 -14px 16px;padding:14px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:460px){.grid,.cards{grid-template-columns:1fr}}
@media print{aside,button,header label,[role="status"]{display:none!important}main,header{margin:0;padding:0}}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <span class="mark" aria-hidden="true">▥</span>
    <div class="brandcopy"><strong>GSP SMART PPS</strong><small>Plant Problem Solving · GSP.1</small></div>
  </div>
  <nav id="nav" aria-label="เมนูหลัก"></nav>
  <footer>
    <button id="collapse" type="button" aria-label="ย่อหรือขยายเมนู" aria-expanded="true">
      ⇤ <span class="navtext">ย่อเมนู</span>
    </button>
  </footer>
</aside>
<main>
<header class="head">
  <div><span class="kicker">UTILITY OPERATION</span><h1 id="heading">Dashboard</h1></div>
  <label>เดือนรายงาน <input id="month" type="month"></label>
</header>
<div class="content">
  <noscript><p class="error">ต้องเปิด JavaScript เพื่อใช้งาน กรุณาเปิดไฟล์ HTML โดยตรงในเบราว์เซอร์</p></noscript>
  <p id="notice" role="status" hidden></p>

  <section id="overview">
    <div id="metrics" class="cards"></div>
    <div class="panel">
      <div class="section-head">
        <h2>แนวโน้ม Equipment Breakdown</h2>
        <div class="row-buttons">
          <button type="button" data-go="breakdown">บันทึก Breakdown</button>
          <button type="button" data-go="control">บันทึก Off Control</button>
        </div>
      </div>
      <p class="note" id="chartLabel"></p>
      <div class="scroll"><div class="chart" id="chart"></div></div>
    </div>
    <form class="panel" id="noteForm">
      <div class="section-head"><h2>สรุปประจำเดือน</h2></div>
      <label>ประเด็นสำคัญ / สิ่งที่ต้องติดตาม <textarea id="note" maxlength="2500"></textarea></label>
      <div class="actions"><button type="submit" class="primary">บันทึกสรุป</button></div>
    </form>
  </section>

  <section id="breakdown" hidden>
    <form class="panel" id="bdForm" autocomplete="off">
      <div class="section-head"><h2 id="bdTitle">บันทึก Equipment Breakdown</h2><small>* ช่องบังคับ</small></div>
      <div class="grid">
        <label>วันที่เกิดเหตุ * <input type="date" name="date" required></label>
        <label>Equipment Tag * <input name="tag" maxlength="60" placeholder="เช่น P-101A" required></label>
        <label>ประเภท <select name="category"><option>Mechanical</option><option>Electrical</option><option>Instrument</option><option>Process</option><option>Other</option></select></label>
        <label class="wide">ปัญหา / อาการที่พบ * <textarea name="problem" maxlength="1000" required></textarea></label>
        <label class="wide">การแก้ไข / แผนติดตาม <textarea name="action" maxlength="1000"></textarea></label>
        <label>Downtime (ชั่วโมง) * <input type="number" name="hours" min="0" step="0.01" value="0" required></label>
        <label>ผู้รับผิดชอบ <input name="owner" maxlength="80"></label>
        <label>กำหนดเสร็จ <input type="date" name="due"></label>
        <label>สถานะ <select name="status"><option>Open</option><option>In Progress</option><option>Monitor</option><option>Closed</option></select></label>
      </div>
      <div class="actions">
        <button type="submit" class="primary">บันทึกรายการ</button>
        <button type="button" id="bdReset">ล้างฟอร์ม / ยกเลิก</button>
      </div>
      <p id="bdMsg" role="status" hidden></p>
    </form>
    <article class="panel">
      <div class="section-head"><h2>ทะเบียน Equipment Breakdown</h2><small id="bdPeriod"></small></div>
      <div id="bdTable" class="scroll"></div>
    </article>
  </section>

  <section id="control" hidden>
    <form class="panel" id="ocForm" autocomplete="off">
      <div class="section-head"><h2 id="ocTitle">บันทึกผล Lab นอก Control</h2><small>*
